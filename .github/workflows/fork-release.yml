name: Fork Release

# Builds the fork's release assets (native SEA bundles, desktop installers and
# pkgforge AppImages) and attaches them to a GitHub Release.
#
# This is the fork-safe counterpart of the upstream `release.yml` pipeline,
# which is gated to the MoonshotAI organisation. It is also the only release
# path: `continuous-release.yml` calls it with tag=continuous.
#
# Guard rails (a failed or half-finished build must never damage a good release):
#   * every build job must succeed before the release job starts (`needs`);
#   * the release job validates the downloaded artifacts before uploading;
#   * a versioned tag is never clobbered unless `allow-overwrite` is set;
#   * the published release is downloaded back and smoke-tested afterwards.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v2.1.0-fork.2, or "continuous")'
        required: true
        type: string
      version:
        description: 'Version label inside the AppImages (defaults to the tag)'
        required: false
        type: string
        default: ''
      create-release:
        description: 'Create/update the GitHub Release and upload the assets'
        required: false
        type: boolean
        default: true
      allow-overwrite:
        description: 'Replace assets that already exist on the release (always on for continuous)'
        required: false
        type: boolean
        default: false
      verify:
        description: 'Download the published assets and smoke-test them'
        required: false
        type: boolean
        default: true
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      version:
        required: false
        type: string
        default: ''
      create-release:
        required: false
        type: boolean
        default: true
      allow-overwrite:
        required: false
        type: boolean
        default: false
      verify:
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  native:
    name: Native bundles
    uses: ./.github/workflows/_native-build.yml
    with:
      upload-artifact-prefix: kimi-code-native
      retention-days: 7
      sign-macos: false
      sign-windows: false
    secrets: inherit

  desktop:
    name: Desktop installers
    uses: ./.github/workflows/desktop-build.yml
    with:
      upload-artifact-prefix: kimi-desktop
      retention-days: 7
      sign-macos: false
    secrets: inherit

  appimage:
    name: AppImages
    uses: ./.github/workflows/appimage.yml
    with:
      version: ${{ inputs.version != '' && inputs.version || inputs.tag }}
      retention-days: 7
      upload-artifact-prefix: kimi-appimage

  release:
    name: Publish release
    needs:
      - native
      - desktop
      - appimage
    if: ${{ inputs.create-release }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download every artifact
        uses: actions/download-artifact@v8
        with:
          path: dist-release

      - name: Validate the artifact set
        # Fails the run before anything is published if a build silently
        # produced nothing usable.
        run: node tools/fork/validate-artifacts.mjs --dir dist-release

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          ALLOW_OVERWRITE: ${{ inputs.allow-overwrite }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; adding assets."
          elif [ "$RELEASE_TAG" = "continuous" ]; then
            gh release create "$RELEASE_TAG" --title "Continuous build" --prerelease --notes "Rolling build of the latest main."
          else
            gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --generate-notes
          fi
          mapfile -d '' files < <(find dist-release -type f \( \
            -name '*.zip' -o -name '*.zip.sha256' \
            -o -name '*.dmg' -o -name '*.exe' -o -name '*.deb' \
            -o -name '*.AppImage' \) -print0 | sort -z)
          printf '%s\n' "${files[@]}"
          args=()
          if [ "$RELEASE_TAG" = "continuous" ] || [ "$ALLOW_OVERWRITE" = "true" ]; then
            args+=(--clobber)
          fi
          gh release upload "$RELEASE_TAG" "${files[@]}" "${args[@]}"

          # A rolling tag must contain exactly this build. Without this, an asset
          # that was renamed (the old, platform-less desktop names) stays on the
          # release and can still be downloaded.
          if [ "$RELEASE_TAG" = "continuous" ]; then
            for f in "${files[@]}"; do basename "$f"; done | sort -u > expected-assets.txt
            gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | sort > published-assets.txt
            while IFS= read -r stale; do
              [ -n "$stale" ] || continue
              echo "Removing stale asset $stale"
              gh release delete-asset "$RELEASE_TAG" "$stale" --yes
            done < <(comm -13 expected-assets.txt published-assets.txt)
          fi

      - name: Ensure a dummy display and the desktop runtime libraries
        if: ${{ inputs.verify }}
        # The AppImage carries its own libraries; the portable Linux zip uses
        # the distro's, and the runner is not a desktop distro.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libgtk-3-0t64 libnss3 libasound2t64 libgbm1 libxss1 libxtst6 \
            libatspi2.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libxkbcommon0

      - name: Smoke-test the published release
        if: ${{ inputs.verify }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: node tools/fork/verify-release.mjs --tag "$RELEASE_TAG" --smoke
