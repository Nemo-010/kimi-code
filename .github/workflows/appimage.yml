name: appimage

# Builds truly portable AppImages for the Kimi Code CLI and Kimi Code Desktop
# with pkgforge-dev's quick-sharun, following
# https://github.com/pkgforge-dev/Anylinux-AppImages/blob/main/HOW-TO-MAKE-THESE.md
#
# Everything runs inside the pkgforge Arch Linux container, which is what
# quick-sharun expects. Node.js is pinned to the repo's .nvmrc rather than the
# distro's package, so the SEA is injected into the same Node the release uses.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label written into the AppImages (e.g. 2.1.0-fork.2)'
        required: false
        type: string
        default: ''
      retention-days:
        description: 'Artifact retention in days'
        required: false
        type: number
        default: 7
      upload-artifact-prefix:
        description: 'Prefix for uploaded artifact name'
        required: false
        type: string
        default: 'kimi-appimage'
  workflow_call:
    inputs:
      version:
        required: false
        type: string
        default: ''
      retention-days:
        required: false
        type: number
        default: 7
      upload-artifact-prefix:
        required: false
        type: string
        default: 'kimi-appimage'

permissions:
  contents: read

jobs:
  appimage:
    name: AppImage (${{ matrix.arch }})
    runs-on: ${{ matrix.runs-on }}
    container: ghcr.io/pkgforge-dev/archlinux:latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-24.04
            arch: x86_64
            nodeArch: x64
          - runs-on: ubuntu-24.04-arm
            arch: aarch64
            nodeArch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Preparing container
        uses: pkgforge-dev/anylinux-setup-action@b2d1ce4216f71162e00ae58fa11ee9aeb723d0d5 # v5

      - name: Install Node.js and pnpm
        run: |
          set -eu
          pacman -Syu --noconfirm base-devel curl xz
          node_version=$(cat .nvmrc)
          curl -fsSL "https://nodejs.org/dist/v${node_version}/node-v${node_version}-linux-${{ matrix.nodeArch }}.tar.xz" -o /tmp/node.tar.xz
          tar -xf /tmp/node.tar.xz -C /opt
          ln -sf "/opt/node-v${node_version}-linux-${{ matrix.nodeArch }}/bin/node" /usr/local/bin/node
          ln -sf "/opt/node-v${node_version}-linux-${{ matrix.nodeArch }}/bin/npm" /usr/local/bin/npm
          ln -sf "/opt/node-v${node_version}-linux-${{ matrix.nodeArch }}/bin/npx" /usr/local/bin/npx
          npm install -g pnpm@10.33.0
          ln -sf "/opt/node-v${node_version}-linux-${{ matrix.nodeArch }}/bin/pnpm" /usr/local/bin/pnpm
          node --version
          pnpm --version

      - name: Install workspace dependencies
        env:
          TMPDIR: ${{ github.workspace }}/.tmp
          ELECTRON_CACHE: ${{ github.workspace }}/.electron-cache
        run: |
          mkdir -p "$TMPDIR" "$ELECTRON_CACHE"
          pnpm install --frozen-lockfile

      - name: Build native executable
        run: pnpm --filter @moonshot-ai/kimi-code run build:native:sea

      - name: Build unpacked desktop app
        env:
          TMPDIR: ${{ github.workspace }}/.tmp
          ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.electron-builder-cache
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm --filter @moonshot-ai/kimi-desktop run dist:dir

      - name: Build the CLI AppImage
        working-directory: packaging/appimage/kimi-code
        env:
          KIMI_SEA: ${{ github.workspace }}/apps/kimi-code/dist-native/bin/linux-${{ matrix.nodeArch }}/kimi
          KIMI_VERSION: ${{ inputs.version != '' && inputs.version || '2.1.0' }}
        run: |
          /bin/sh ./get-dependencies.sh
          /bin/sh ./make-appimage.sh

      - name: Build the desktop AppImage
        working-directory: packaging/appimage/kimi-desktop
        env:
          KIMI_VERSION: ${{ inputs.version != '' && inputs.version || '2.1.0' }}
        run: |
          set -eu
          # electron-builder names the unpacked tree linux-unpacked on x64 and
          # linux-<arch>-unpacked elsewhere.
          unpacked=$(find "$GITHUB_WORKSPACE/apps/kimi-desktop/dist-app" -maxdepth 1 -type d -name 'linux*-unpacked' | head -n 1)
          echo "Using unpacked desktop app: $unpacked"
          KIMI_DESKTOP_UNPACKED="$unpacked" /bin/sh ./get-dependencies.sh
          KIMI_DESKTOP_UNPACKED="$unpacked" /bin/sh ./make-appimage.sh

      - name: Verify the desktop AppImage layout
        # A host without fontconfig renders the whole UI with no text if the
        # AppImage has no conf.d rules or no font. The preload bundle carries the
        # window bridge, and the AppRun must not force the bundled fontconfig on
        # a host that has its own. The browser MCP entry has to be inside the
        # asar, executable on its own, and answer the protocol the committed web
        # bundle renders. The Terminal panel is the shell's own, because the web
        # bundle in this repo has none. Fail the build, not the release.
        working-directory: packaging/appimage/kimi-desktop
        run: |
          set -eu
          ./dist/Kimi-Code-Desktop-*.AppImage --appimage-extract >/dev/null
          test -d squashfs-root/etc/fonts/conf.d
          test -n "$(ls -A squashfs-root/share/fonts)"
          test -f squashfs-root/bin/10-fontconfig.hook
          ! grep -q 'export FONTCONFIG_PATH' squashfs-root/bin/10-fontconfig.hook
          test -f squashfs-root/bin/resources/app.asar

          npx --yes @electron/asar extract squashfs-root/bin/resources/app.asar asar-out
          test -f asar-out/out/preload/index.cjs
          test -f asar-out/out/main.cjs

          # The Browser panel: the preload must carry the masked-webview surface
          # and both bridge objects the committed web bundle probes for.
          grep -aq 'createElement("webview")' asar-out/out/preload/index.cjs
          grep -aq 'exposeInMainWorld("kimiBrowser"' asar-out/out/preload/index.cjs
          grep -aq 'exposeInMainWorld("kimiDesktop"' asar-out/out/preload/index.cjs

          # The MCP server the agent's `mcp__desktop_browser__run` tool reaches.
          # It must be served from the main process: the AppImage ships no Node
          # interpreter, so a stdio entry could never be spawned.
          grep -aq 'desktop_browser' asar-out/out/main.cjs
          grep -aq 'Streamable' asar-out/out/main.cjs || grep -aq 'mcp-session-id' asar-out/out/main.cjs
          grep -aq 'kimi.browser/1.0.0' asar-out/out/main.cjs
          grep -aq '127.0.0.1' asar-out/out/main.cjs
          # No spawned interpreter may be referenced in the MCP entry writer.
          ! grep -aq 'transport: "stdio"' asar-out/out/main.cjs
          # The browser drives a real page: a drag has to dispatch mouse events,
          # and the surface operations have to reach the tab they name.
          grep -aq 'mousedown' asar-out/out/main.cjs
          grep -aq 'setDevice' asar-out/out/main.cjs
          grep -aq 'enableDeviceEmulation' asar-out/out/main.cjs

          # Bridge members the shipped web bundle gates features on: without
          # getPathForFile the composer silently drops dropped files.
          grep -aq 'getPathForFile' asar-out/out/preload/index.cjs
          grep -aq 'setOnboarded' asar-out/out/preload/index.cjs

          # The Terminal panel. The shipped web bundle has no terminal of its
          # own, so the shell provides one; it must speak the daemon's terminal
          # protocol and carry the panel itself, or the panel is decoration.
          grep -aq 'terminal_attach' asar-out/out/preload/index.cjs
          grep -aq 'terminal_input' asar-out/out/preload/index.cjs
          grep -aq 'terminal_resize' asar-out/out/preload/index.cjs
          grep -aq 'terminal_output' asar-out/out/preload/index.cjs
          grep -aq 'kimi-code.bearer.' asar-out/out/preload/index.cjs
          grep -aq 'api/v1/ws' asar-out/out/preload/index.cjs
          grep -aq 'kimi-terminal-panel' asar-out/out/preload/index.cjs
          grep -aq 'kimi-terminal:toggle' asar-out/out/main.cjs

          echo "desktop AppImage ships $(ls squashfs-root/etc/fonts/conf.d | wc -l) fontconfig rules, $(ls squashfs-root/share/fonts | wc -l) fonts, the masked-webview Browser panel, the Terminal panel and the desktop_browser MCP server"
          rm -rf squashfs-root asar-out

      - name: Upload the AppImages
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.upload-artifact-prefix }}-${{ matrix.arch }}
          retention-days: ${{ inputs.retention-days }}
          path: packaging/appimage/*/dist/*.AppImage
          if-no-files-found: error
